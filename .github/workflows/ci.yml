name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - name: Build development image with native libvips
        run: docker build --platform "${{ matrix.platform }}" --target development -t evathumber:test .
      - name: Run tests and analysis on actual architecture
        # uid 33 is the production image's user, so permission-sensitive assertions
        # (readiness vs an unwritable cache) actually execute instead of being skipped.
        run: >
          docker run --rm --platform "${{ matrix.platform }}" --user 33:33
          --entrypoint sh evathumber:test -c 'uname -m && php -v && vips --version
          && composer test -- --do-not-cache-result && composer analyse'
      - name: Build production image
        run: docker build --platform "${{ matrix.platform }}" --target production -t evathumber:smoke .
      - name: Verify readonly nonroot HTTP and shutdown
        run: php tests/container-smoke.php evathumber:smoke "${{ matrix.platform }}"
      - name: RC1 product acceptance on the documented two-flag invocation
        run: php tests/rc1-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Product acceptance across cache volume modes
        run: php tests/product-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Docker acceptance matrix
        run: php tests/docker-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Crash recovery acceptance
        run: php tests/crash-recovery.php evathumber:smoke "${{ matrix.platform }}"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # OCI references must be lowercase, but GitHub keeps the repository's own
      # capitalisation, so ghcr.io/Owner/Repo is rejected by the registry.
      - name: Resolve the lowercase image reference
        id: ref
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.ref.outputs.image }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
