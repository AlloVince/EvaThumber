name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - name: Build development image with native libvips
        run: docker build --platform "${{ matrix.platform }}" --target development -t evathumber:test .
      - name: Run tests and analysis on actual architecture
        # uid 33 is the production image's user, so permission-sensitive assertions
        # (readiness vs an unwritable cache) actually execute instead of being skipped.
        run: >
          docker run --rm --platform "${{ matrix.platform }}" --user 33:33
          --entrypoint sh evathumber:test -c 'uname -m && php -v && vips --version
          && composer test -- --do-not-cache-result && composer analyse'
      - name: Build production image
        run: docker build --platform "${{ matrix.platform }}" --target production -t evathumber:smoke .
      - name: Verify readonly nonroot HTTP and shutdown
        run: php tests/container-smoke.php evathumber:smoke "${{ matrix.platform }}"
      - name: RC1 product acceptance on the documented two-flag invocation
        run: php tests/rc1-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Product acceptance across cache volume modes
        run: php tests/product-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Docker acceptance matrix
        run: php tests/docker-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Crash recovery acceptance
        run: php tests/crash-recovery.php evathumber:smoke "${{ matrix.platform }}"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/allovince/evathumber
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Branch and pull request runs only build and cache. A tag publishes
      # docker.io/allovince/evathumber:<version without v>, plus :latest for a
      # stable release, which is what the README quick start pulls.
      - name: Resolve the release version and tags
        id: meta
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          declared=$(sed -n "s/^ *public const string VERSION = '\([^']*\)';.*/\1/p" src/Version.php)
          if [ -z "$declared" ]; then
            echo "::error::src/Version.php declares no VERSION constant; the release gate cannot read the version"
            exit 1
          fi
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.version=$declared"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=${GITHUB_REF_NAME#v}
          # Semver without build metadata: a Docker tag cannot carry "+", so a
          # v1.2.3+build.4 tag has no image name to publish under.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! $version =~ $semver ]]; then
            echo "::error::$GITHUB_REF_NAME is not a v<major>.<minor>.<patch>[-prerelease] semver tag"
            exit 1
          fi
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/Version.php ($declared); bump the constant in the release commit"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::secrets.DOCKERHUB_TOKEN is required to publish a v* tag"
            exit 1
          fi

          tags=("$IMAGE:$version")
          # A prerelease is a candidate, not a stable default: :latest stays
          # on the last stable release until the matching stable tag lands.
          if [ "$version" = "${version#*-}" ]; then
            tags+=("$IMAGE:latest")
          fi

          {
            echo "push=true"
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: allovince
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
