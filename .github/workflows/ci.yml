name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, fileinfo
      - run: composer install --no-interaction --prefer-dist
      - name: Build development image with native libvips
        run: docker build --platform "${{ matrix.platform }}" --target development -t evathumber:test .
      - name: Run tests and analysis on actual architecture
        # uid 33 is the production image's user, so permission-sensitive assertions
        # (readiness vs an unwritable cache) actually execute instead of being skipped.
        run: >
          docker run --rm --platform "${{ matrix.platform }}" --user 33:33
          --entrypoint sh evathumber:test -c 'uname -m && php -v && vips --version
          && composer test -- --do-not-cache-result && composer analyse'
      - name: Build production image
        run: docker build --platform "${{ matrix.platform }}" --target production -t evathumber:smoke .
      - name: Verify readonly nonroot HTTP and shutdown
        run: php tests/container-smoke.php evathumber:smoke "${{ matrix.platform }}"
      - name: RC1 product acceptance on the documented two-flag invocation
        run: php tests/rc1-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Product acceptance across cache volume modes
        run: php tests/product-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Docker acceptance matrix
        run: php tests/docker-acceptance.php evathumber:smoke "${{ matrix.platform }}"
      - name: Crash recovery acceptance
        run: php tests/crash-recovery.php evathumber:smoke "${{ matrix.platform }}"

  # A release is declared by the commit that writes a new Version::VERSION.
  # This job turns that declaration into the v* tag itself, so nobody has to
  # tag and push by hand. A tag pushed with GITHUB_TOKEN does not start a new
  # workflow run, which is why the image is published by the run that created
  # the tag instead of by a separate tag run.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-version
        id: version
      - name: Create and push the v* tag for the declared version
        id: tag
        env:
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          TAG_COMMIT: ${{ steps.version.outputs.tag_commit }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "$GIT_TAG is already released at $TAG_COMMIT; this commit publishes nothing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checked before the tag exists: a tag without a published image is a
          # release nobody can install.
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::secrets.DOCKERHUB_TOKEN is required to tag and publish a release"
            exit 1
          fi

          if [ -z "$TAG_COMMIT" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$GIT_TAG" -m "EvaThumber ${GIT_TAG#v}" "$GITHUB_SHA"
            git push origin "refs/tags/$GIT_TAG"
            echo "Pushed $GIT_TAG at $GITHUB_SHA."
          else
            # A re-run of the run that created this tag: publish again, so a
            # failed image push is recoverable without inventing a version.
            echo "$GIT_TAG already points at this commit; republishing."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  image:
    # release only runs on main pushes, so branch and pull request runs see it
    # skipped and still build for the gha cache without publishing.
    needs: [test, release]
    if: always() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: ./.github/actions/release-version
        id: version
      - name: Log in to Docker Hub
        if: needs.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: allovince
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.release.outputs.publish == 'true' }}
          tags: ${{ steps.version.outputs.docker_tags }}
          labels: ${{ steps.version.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
